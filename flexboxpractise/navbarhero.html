<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        a{
            text-decoration: none;
            color: aliceblue;
        }
        #container{
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: rgb(76, 101, 165);
            padding-right: 100px;
        }
        #anchors{
            display: flex;
            justify-content: space-between;
            gap: 20px;
            
        }
        button{
            text-align: left;
            padding: 5px;
            width: 150px;
            margin-top: 10px;
            margin-bottom: 40px;
            border-radius:4px;
            color: aliceblue;
            background-color: #17324d; 
        }
        #hero{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color:#bbdefb;
        }
        h2{
            margin-top: 20px;
            margin-bottom: 0px;
        }
    </style>
  </head>
  <body>
    <div id = "container">
      <div>
        <a id="logo" href="">CAMPUS STORE</a>
      </div>
      <div id = "anchors">
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Services</a>
        <a href="">Contact</a>

      </div>
    </div>
    <div id = "hero">
        <h2>Small essentials.Big campus energy.</h2>
        <p>Everything you need for a productive semester.</p>
        <button>Explore</button>
    </div>
  </body>
</html>
