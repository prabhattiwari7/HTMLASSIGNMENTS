<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #gridcontainer {
        border: 2px solid black;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        gap: 20px;
        background-color: black;
      }
      div{
        padding: 10px;
        border: 2px solid black;
        background-color: white;
        border-radius: 4px;
      }

      img{
        width: 100%;
        height: 200px;

      }
    </style>
  </head>
  <body>
    <div id="gridcontainer">
      <div><img src="gallery.jpeg" alt="" /></div>
      <div><img src="gallery2.jpeg" alt="" /></div>
      <div><img src="gallery3.jpeg" alt="" /></div>
      <div><img src="galley4.jpeg" alt="" /></div>
      <div><img src="gallery5.jpeg" alt="" /></div>
      <div><img src="gallery6.jpeg" alt="" /></div>
      <div><img src="gallery7.jpeg" alt="" /></div>
      <div><img src="gallery8.jpeg" alt="" /></div>
      <div><img src="gallery9.jpeg" alt="" /></div>
    </div>
  </body>
</html>
