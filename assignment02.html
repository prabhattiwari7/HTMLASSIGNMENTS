<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            
            padding: 0;
        }
        b{
            color:rgb(0, 138, 0)
        }
        input{
            margin: 10px 0px;
            width: 100%;
            padding: 8px;
        }
        #div{
            padding: 10px;
        }
        #male{
            width: auto;

        }
         #female{
            width: auto;

        }
         #others{
            width: auto;

        }
        #course{
            margin-top: 10px;
        }
        select{
            padding: 10px;
            width:100%;
            margin-bottom: 10px;
        }
         #html{
            width: auto;

        }
         #css{
            width: auto;

        }
         #js{
            width: auto;

        }
        #color{
            width: 70px;
        }
        button{
            color: aliceblue;
            background-color:rgb(17, 82, 17) ;
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
        }
        textarea{
            width: 100%;
            height: 100px;
        }

    </style>
</head>
<body>
    <div id = "div">
    <h2>Application Form</h2>
    <p>Student internship application. *Required</p>
    <b>Personal Details / fieldset + legend</b>
    <br><br>
    <label for="name">Full name *</label>
    <br>
    <input id = "name"type="text" placeholder="Prabhat Tiwari" required>
    <label for="email">Email *</label>
    <br>
    <input id ="email"type="email" placeholder = "prabhat7@gmail.com" required>
    <label for="password">Password *</label>
    <br>
    <input id = "password" type="password" placeholder="&#8226 &#8226 &#8226 &#8226 &#8226 &#8226 &#8226 &#8226 &#8226 &#8226 &#8226" required>
    <label for="phone">Phone *</label>
    <br>
    <input id = "phone" type="tel" placeholder = "9797273979" required>
    <label for="url">Portfolio URL</label>
    <br>
    <input id = "url" type="url" placeholder="https://example.com">
    <label for="age">Age *</label>
    <br>
    <input id = "age" type="number" placeholder = "18" required>
    <label for="gender">Gender:</label>
    <input id = "male"type="radio" name="gender">
    <label for="male">Male</label>
    <input id = "female"type="radio" name="gender">
    <label for="female">Female</label>
    <input type="radio" id = "others" name="gender">
    <label for="others">Others / prefer not to say</label>
    <br> <br>
    <b>Education / fieldset + legend</b>
    <br><br>
    <label for="course">Course *</label>
    <br>
    <select name="course" id="course">
    <option value="btech-cs">Btech - Computer Science</option>
    <option value="btech-it">Btech - Information Technology</option>
    <option value="btech-me">Btech - Mechanical Engineering</option>
    <option value="btech-ee">Btech - Electrical Engineering</option>
    <option value="btech-it">Btech - Information Technology</option>
    </select>
    <br>
    <label for="city">Prefereed city (datalist)</label>
   <input id = "city"type="text" placeholder="Delhi">
   <label for="skills">Skills:</label>
   <input id = "html" type="checkbox" name = "skills" value = "HTML">
   <label for="html">HTML</label>
   <input id = "css" type="checkbox" name = "skills" value = "CSS">
   <label for="css">CSS</label>
    <input id = "js" type="checkbox" name = "skills" value = "JavaScript">
   <label for="js">JavaScript</label>
   <br><br>
   <b>Upload & Extras / fieldset + legend</b>
   <br><br>
   <label for="available">Available from</label>
   <br>
  <input id = "available" type="text" value="15 / 11 / 2026">
  <label for="time">Interview time</label>
  <input type="text" value="10:30 AM">
  <label for="resume">Resume * </label>
  <input type="file" id = "resume">
  <label for="stipend">Expected monthly stipend:10,000</label>
  <input id = "stipend" type="range">
  <label for="color">Favorite colour:</label>
  <input id ="color" type="color">
  <br><br>
  <label for="why">Why would you like to join?</label>
  <br>
 <textarea id ="why"type="text" placeholder="I want to practtise HTML and CSS on real projects." ></textarea> 
 <br><br>
 <button>Sumbit application</button>
 <button>Reset</button>


   
   

</div>
    
</body>
</html>
